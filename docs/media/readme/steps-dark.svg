<text x="120" y="420" class="sans" font-size="32" font-weight="700" fill="#efeee6" text-anchor="start">Clone and build</text>
<rect x="568" y="170" width="456" height="300" rx="28" fill="#2a2a2a" stroke="#363636" stroke-width="2"/>
<text x="608" y="254" class="serif" font-size="60" font-weight="700" fill="#85857f" text-anchor="start">2</text>
