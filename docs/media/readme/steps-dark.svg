<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-label="Get started in a minute: 1. Clone and build (git clone … &amp;&amp; npm run build) 2. Add it to your agent (claude mcp add whiteboard …) 3. Ask for a drawing (&quot;Draw this repo for me&quot;)">
<title>Get started in a minute: 1. Clone and build (git clone … &amp;&amp; npm run build) 2. Add it to your agent (claude mcp add whiteboard …) 3. Ask for a drawing (&quot;Draw this repo for me&quot;)</title>
<style>
