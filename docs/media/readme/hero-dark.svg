<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-label="Whiteboard MCP: a live whiteboard your coding agent draws on. You draw back.">
<title>Whiteboard MCP: a live whiteboard your coding agent draws on. You draw back.</title>
<style>
