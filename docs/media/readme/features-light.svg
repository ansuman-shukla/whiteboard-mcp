<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="Why whiteboard-mcp: Draws step by step: Boxes, arrows and notes, one idea at a time, pointing at each part. Sees what you draw: Move, circle or note anything. It gets a short list of exactly what changed. Right beside the chat: A tab next to the chat in VS Code, Cursor, Windsurf, or your browser. Remembers boards: One board per chat, saved on disk. Reopen or search it from any chat. Local and private: Runs on 127.0.0.1 with a token. Nothing leaves your machine. Tiny: One runtime dependency and about 7 KB of tool schema per turn.">
