<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="962" viewBox="0 0 1600 962" role="img" aria-label="whiteboard-mcp vs Excalidraw MCP. Sees what you draw back: whiteboard-mcp yes (Short list of your changes + notes), Excalidraw MCP part (Re-reads the whole scene). Agent screenshots its own board: whiteboard-mcp yes, Excalidraw MCP no. Edit one shape in place: whiteboard-mcp yes (Arrows stay attached), Excalidraw MCP part (Re-sends from a checkpoint). Boards outlive the chat: whiteboard-mcp yes (Reopen by name, search the text), Excalidraw MCP no (Tied to the chat). Works in any MCP client: whiteboard-mcp yes (Plus a plain CLI), Excalidraw MCP no (Only hosts with MCP Apps). Mermaid to hand-drawn: whiteboard-mcp yes, Excalidraw MCP no. Animated camera moves: whiteboard-mcp no, Excalidraw MCP yes. Zero install (hosted URL): whiteboard-mcp no (Clone and build), Excalidraw MCP yes.">
