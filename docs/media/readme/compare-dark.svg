<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="856" viewBox="0 0 1600 856" role="img" aria-label="Whiteboard MCP vs Excalidraw MCP. Sees what you draw back: Whiteboard MCP yes (Short list of your changes + notes), Excalidraw MCP part (Re-reads the whole scene). Agent screenshots its own board: Whiteboard MCP yes, Excalidraw MCP no. Edit one shape in place: Whiteboard MCP yes (Arrows stay attached), Excalidraw MCP part (Re-sends from a checkpoint). Boards outlive the chat: Whiteboard MCP yes (Reopen by name, search the text), Excalidraw MCP no (Tied to the chat). Works in any MCP client: Whiteboard MCP yes (Plus a plain CLI), Excalidraw MCP no (Only hosts with MCP Apps). Mermaid to hand-drawn: Whiteboard MCP yes, Excalidraw MCP no. Animated camera moves: Whiteboard MCP no, Excalidraw MCP yes. Zero install (hosted URL): Whiteboard MCP no (One npx line, runs locally), Excalidraw MCP yes.">
